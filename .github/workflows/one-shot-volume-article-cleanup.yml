name: One-shot volume article cleanup

on:
  push:
    branches:
      - worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3
          fetch-depth: 0

      - name: Apply exact cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/base/definitions.py')
          text = path.read_text()

          old_ws = '        """Get the type of websocket event.\n'
          new_ws = '        """Get the type of event.\n'
          assert text.count(old_ws) == 1, text.count(old_ws)
          text = text.replace(old_ws, new_ws, 1)

          marker = 'class ExternalDownload(Download):'
          before, external = text.split(marker, 1)
          old_limit = (
              '            DownloadLimitReached: At the source that is downloaded from,\n'
              "                we've reached a rate limit."
          )
          new_limit = (
              '            DownloadLimitReached: Can\'t download because the limit of the service\n'
              '                is reached.'
          )
          assert external.count(old_limit) >= 2, external.count(old_limit)
          external = external.replace(old_limit, new_limit, 1)

          path.write_text(before + marker + external)
          PY

          python -m py_compile backend/base/definitions.py
          rm .github/workflows/one-shot-volume-article-cleanup.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Clean article naming definitions diff"
          git push origin HEAD:worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3

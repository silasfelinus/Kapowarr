name: One-shot volume article cleanup

on:
  push:
    branches:
      - worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3
          fetch-depth: 0

      - name: Apply exact cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/base/definitions.py')
          text = path.read_text()
          old = '    retried. Without it a throttled request failed on its first answer, and\n'
          new = '    retried. Without it a throttled request failed on the first answer, and\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY

          python -m py_compile backend/base/definitions.py
          rm .github/workflows/one-shot-volume-article-cleanup.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Finish article naming diff cleanup"
          git push origin HEAD:worker/kapowarr-volume-folder-the-20260823T1350Z-a9f3

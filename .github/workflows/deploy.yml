name: Build docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Setup checkout

      - uses: actions/setup-python@v6
        name: Setup python 3.12
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r docs/requirements-docs.txt
        name: Install dependencies

      - run: mkdocs build -f docs/mkdocs.yml
        name: Build docs

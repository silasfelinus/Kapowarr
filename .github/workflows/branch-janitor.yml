name: Branch janitor

# Automatically removes the head branch after a same-repository PR is merged.
# Also keeps the on-demand escape hatch for clearing older stale claude/* and
# worker/* branches: auto-deletes branches fully merged into main, and
# force-deletes any branches named explicitly (for confirmed-superseded branches
# that aren't a strict git ancestor of main, e.g. squash-merged content).
# Runs with GITHUB_TOKEN, which can delete refs even when agent session
# credentials cannot.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only — delete nothing"
        type: boolean
        default: false
      force_delete_branches:
        description: "Comma-separated branch names to delete regardless of merge state"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: branch-janitor
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prune merged / superseded branches (report unmerged)
        run: |
          python scripts/branch_janitor.py \
            ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }} \
            --force-delete "${{ github.event_name == 'pull_request' && github.head_ref || github.event.inputs.force_delete_branches }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

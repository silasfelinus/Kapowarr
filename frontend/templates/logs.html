{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block css %}
	<link rel="stylesheet" href="{{ url_for('static', filename='css/logs.css') }}">
{% endblock %}
{% block js %}
	<script src="{{ url_for('static', filename='js/logs.js') }}" defer></script>
{% endblock %}

{% block main %}
<main class="page-flow">
	<section class="logs-toolbar" aria-label="Log controls">
		<div class="logs-actions">
			<button id="refresh-logs" type="button">Refresh</button>
			<button id="clear-logs" type="button" class="secondary">Clear</button>
			<a id="download-logs" class="secondary" href="">Download</a>
		</div>
		<div class="logs-filters">
			<label>
				<span>Show</span>
				<select id="log-page-size">
					<option value="25">25 per page</option>
					<option value="50" selected>50 per page</option>
					<option value="100">100 per page</option>
					<option value="250">250 per page</option>
					<option value="500">500 per page</option>
				</select>
			</label>
			<label>
				<span>Level</span>
				<select id="log-view-level">
					<option value="ALL" selected>All levels</option>
					<option value="CRITICAL">Critical</option>
					<option value="ERROR">Error</option>
					<option value="WARNING">Warning</option>
					<option value="INFO">Info</option>
					<option value="DEBUG">Debug</option>
				</select>
			</label>
		</div>
	</section>

	<section class="logs-table-wrap" aria-label="Application logs">
		<table class="logs-table">
			<thead>
				<tr>
					<th class="log-col-time">Time</th>
					<th class="log-col-level">Type</th>
					<th>Message</th>
				</tr>
			</thead>
			<tbody id="log-rows"></tbody>
		</table>
		<p id="logs-empty" class="hidden">No log entries match this filter.</p>
	</section>

	<nav class="logs-pagination" aria-label="Log pages">
		<p id="logs-status" aria-live="polite"></p>
		<div class="logs-page-buttons">
			<button id="log-first" type="button" title="First page">&laquo;</button>
			<button id="log-prev" type="button" title="Previous page">&lsaquo;</button>
			<span id="log-page-label"></span>
			<button id="log-next" type="button" title="Next page">&rsaquo;</button>
			<button id="log-last" type="button" title="Last page">&raquo;</button>
		</div>
	</nav>
</main>
{% endblock main %}
